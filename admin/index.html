<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin · WorkerPool</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--bg:#f3f6f5;--surface:#fff;--fg:#1b2628;--muted:#5a696b;--line:#d3dcda;--accent:#3f7a72;--accent-soft:#dcebe7;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--body:"Figtree","Segoe UI",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121819;--surface:#1d2729;--fg:#e3ebe9;--muted:#97a7a5;--line:#2c3a3c;--accent:#7fbcb2;--accent-soft:#213431;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px}

/* WorkerPool analytics: owner-only dashboard */
.wpa-entry{font:inherit;font-size:.82rem;font-weight:600;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 12px;cursor:pointer}
.wpa-entry:hover{color:var(--fg);border-color:var(--fg)}
.wpa-ov{background:var(--bg);overflow-y:auto;padding-block:max(16px,env(safe-area-inset-top,0px)) max(32px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-family:var(--body);color:var(--fg)}
.wpa{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.wpa-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.wpa-top h2{font-family:var(--display);font-size:1.6rem;font-weight:650;margin:0;letter-spacing:-.01em}
.wpa-top p{margin:2px 0 0;color:var(--muted);font-size:.85rem}
.wpa-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wpa-seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.wpa-seg button{font:inherit;font-size:.82rem;font-weight:600;border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer}
.wpa-seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.wpa-close{font:inherit;font-weight:600;font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 14px;cursor:pointer}
.wpa-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.wpa-kpis{grid-template-columns:1fr 1fr}}
.wpa-kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.wpa-kpi small{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.wpa-kpi b{display:block;font-family:var(--display);font-size:1.9rem;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:4px}
.wpa-kpi span{font-size:.8rem;color:var(--muted)}
.wpa-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:820px){.wpa-grid{grid-template-columns:1fr}}
.wpa-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.wpa-card.wide{grid-column:1/-1}
.wpa-card h3{font-family:var(--display);font-size:1rem;font-weight:600;margin:0}
.wpa-card .sub{font-size:.8rem;color:var(--muted);margin-top:-8px}
.wpa-bars{display:flex;flex-direction:column;gap:7px}
.wpa-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 46px;gap:10px;align-items:center;font-size:.85rem}
.wpa-row .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wpa-row .t{height:8px;border-radius:4px;background:var(--accent-soft);overflow:hidden}
.wpa-row .t i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.wpa-row .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.wpa-chart{position:relative;overflow-x:auto}
.wpa-chart svg{display:block;width:100%;min-width:520px;height:auto}
.wpa-chart rect.b{fill:var(--accent)}
.wpa-chart rect.b:hover{opacity:.75}
.wpa-chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.wpa-chart line{stroke:var(--line)}
.wpa-tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:.75rem;padding:4px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%)}
.wpa-tbl{overflow-x:auto}
.wpa-tbl table{width:100%;border-collapse:collapse;font-size:.82rem;min-width:620px}
.wpa-tbl th{text-align:left;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.wpa-tbl td{padding:8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.wpa-empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:28px;color:var(--muted);text-align:center}
.wpa-note{font-size:.78rem;color:var(--muted)}
/* drill-down: every number opens the visits behind it */
[data-drill]{cursor:pointer}
.wpa-row[data-drill]{border-radius:8px;margin:-3px -6px;padding:3px 6px}
.wpa-row[data-drill]:hover,.wpa-row[data-drill]:focus-visible{background:var(--accent-soft);outline:none}
.wpa-row[data-drill] .v{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.wpa-kpi[data-drill]:hover,.wpa-kpi[data-drill]:focus-visible{border-color:var(--accent);outline:none}
.wpa-kpi[data-drill] b{color:var(--accent)}
.wpa-tbl tr[data-drill]:hover td{background:var(--accent-soft)}
.dr-ov{position:fixed;inset:0;background:rgba(10,20,20,.35);z-index:60}
.dr-pn{position:fixed;top:0;right:0;bottom:0;width:min(980px,100%);background:var(--bg);z-index:61;display:flex;flex-direction:column;box-shadow:-20px 0 50px -20px rgba(0,0,0,.4)}
.dr-hd{display:flex;align-items:flex-start;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.dr-hd h3{margin:0;font-size:1.1rem}
.dr-hd p{margin:4px 0 0;color:var(--muted);font-size:.84rem}
.dr-hd .dl{margin-left:auto;flex:none}
.dr-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line)}
.dr-tools input{font:inherit;font-size:.86rem;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg);flex:1;min-width:180px}
.dr-chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 20px 0}
.dr-chip{font-size:.78rem;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--fg)}
.dr-chip b{font-weight:700}
.dr-body{flex:1;overflow:auto;padding:12px 20px 24px}
.dr-body table{width:100%;border-collapse:collapse;font-size:.83rem;min-width:760px}
.dr-body th{position:sticky;top:-12px;background:var(--bg);text-align:left;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
.dr-body td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.dr-body tr.v{cursor:pointer}
.dr-body tr.v:hover td{background:var(--surface)}
.dr-body tr.x td{background:var(--surface);padding:12px 14px}
.dr-det{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 20px;font-size:.82rem}
.dr-det small{display:block;color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em}
.dr-det ul{margin:4px 0 0;padding-left:16px}
.dr-vid{font-family:ui-monospace,monospace;font-size:.78rem;color:var(--accent);text-decoration:underline;background:none;border:0;padding:0;cursor:pointer}
.dr-more{display:block;margin:14px auto 0}
@media (max-width:640px){.dr-hd,.dr-tools,.dr-body{padding-left:12px;padding-right:12px}.dr-chips{padding:10px 12px 0}
  .dr-body table{min-width:0}.dr-body thead{display:none}
  .dr-body tr.v{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;padding:10px 4px;border-bottom:1px solid var(--line)}
  .dr-body tr.v td{display:block;border:0;padding:0;font-size:.82rem}
  .dr-body tr.v td::before{content:attr(data-l);display:block;font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .dr-body tr.v td.w{grid-column:1/-1;font-weight:700;white-space:normal!important}
  .dr-body tr.v td.w::before{display:none}
  .dr-body tr.x{display:block}.dr-body tr.x td{display:block}}

.gate{max-width:380px;margin:12vh auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:14px}
.gate h1{font-family:var(--display);margin:0;font-size:1.5rem}
.gate input{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.gate button,.dl{font:inherit;font-weight:600;padding:11px 16px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:var(--surface);cursor:pointer}
.dl{padding:7px 14px;font-size:.82rem;background:transparent;color:var(--fg);border-color:var(--line)}
.err{color:#b4552d;font-size:.85rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:inherit;font-weight:600;font-size:.88rem;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{color:var(--fg);border-color:var(--fg)}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--fg)}
.wpa-tbl td details summary{cursor:pointer;color:var(--accent)}
.wpa-tbl pre{white-space:pre-wrap;font-size:.75rem;max-width:520px}
.chat-grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:12px;min-height:480px}
@media (max-width:760px){.chat-grid{grid-template-columns:1fr}}
.chat-list{display:flex;flex-direction:column;gap:6px;max-height:640px;overflow-y:auto}
.chat-item{font:inherit;text-align:left;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.chat-item[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chat-item .r1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.chat-item small{color:var(--muted);font-size:.75rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-unread{background:#d4572f;color:#fff;border-radius:999px;font-size:.7rem;font-weight:700;padding:1px 7px}
.chat-conv{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:480px}
.chat-top{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chat-top small{display:block;color:var(--muted);font-size:.78rem}
.chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg);max-height:520px}
.chat-m{max-width:80%;padding:8px 12px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word;font-size:.9rem}
.chat-m small{display:block;font-size:.7rem;opacity:.7;margin-top:2px}
.chat-m.v{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.chat-m.a{align-self:flex-end;background:var(--accent);color:var(--surface)}
.chat-reply{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);align-items:flex-end}
.chat-reply textarea{flex:1;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);resize:vertical;min-height:44px}
.chat-file{display:flex;align-items:center;gap:8px;font:inherit;font-weight:600;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.chat-file em{font-style:normal;font-weight:400;opacity:.75;font-size:.78rem}
.chat-img{display:block;max-width:260px;max-height:200px;border-radius:9px;margin:2px 0;cursor:pointer}
.chat-clip{flex:none;font:inherit;font-weight:600;font-size:.82rem;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chat-live{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted)}
.chat-live i{width:9px;height:9px;border-radius:50%;background:#3fae6c}
.chat-live i.off{background:#b9c2c1}
.chat-voice{display:flex;flex-direction:column;gap:6px;min-width:260px}
.chat-voice audio{width:100%;height:40px}
.nw-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.nw-form{grid-template-columns:1fr}}
.nw-form label{display:flex;flex-direction:column;gap:5px;font-size:.82rem;font-weight:600}
.nw-form .full{grid-column:1/-1}
.nw-form input,.nw-form select,.nw-form textarea{font:inherit;font-weight:400;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.nw-form .chk{flex-direction:row;align-items:center;gap:8px}
.nw-acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nw-list{display:flex;flex-direction:column;gap:10px}
.nw-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--bg)}
.nw-item.arch{opacity:.7}
.nw-item b{display:block;font-size:.95rem}
.nw-item small{color:var(--muted);font-size:.78rem}
.nw-tag{display:inline-block;font-size:.66rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:5px;margin-right:6px;vertical-align:1px}
.nw-tag.hot{background:#ff5a36;color:#fff}.nw-tag.new{background:#ffd23f;color:#2a2100}.nw-tag.trending{background:#7c5cff;color:#fff}.nw-tag.update{background:var(--accent-soft);color:var(--fg)}
.nw-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.vs-card{display:flex;align-items:center;gap:24px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 20px;margin:0 0 16px}
.vs-lab{flex:none;display:flex;flex-direction:column;gap:4px;font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.vs-l{display:flex;align-items:center;gap:8px}
.vs-lab small{font-size:.7rem;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.vs-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#1f9d63;animation:vsPing 2s ease-out infinite}
@keyframes vsPing{0%{box-shadow:0 0 0 0 rgba(31,157,99,.5)}70%,100%{box-shadow:0 0 0 9px rgba(31,157,99,0)}}
.vs-grid{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.vs-t{display:flex;flex-direction:column;gap:2px;padding:4px 12px;border-left:1px solid var(--line)}
.vs-t b{font-size:1.5rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.vs-t span{font-size:.78rem;color:var(--muted)}
.vs-t.now b{color:#1f9d63}
@media (max-width:760px){.vs-card{flex-direction:column;align-items:stretch;gap:8px}.vs-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.vs-t{border-left:0;padding:4px 2px}}
@media (prefers-reduced-motion:reduce){.vs-dot{animation:none}}
@media (max-width:820px){.shopgrid{grid-template-columns:1fr!important}}
.ml-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:860px){.ml-grid{grid-template-columns:1fr}}
.ml-hint{margin:0;color:var(--muted);font-size:.84rem}
.ml-hint code{background:var(--accent-soft);padding:1px 5px;border-radius:5px}
.ml-chips{display:flex;flex-wrap:wrap;gap:6px}
.ml-chip{font:inherit;font-size:.82rem;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:6px 11px;border-radius:999px;cursor:pointer}
.ml-chip em{font-style:normal;color:var(--muted);font-weight:500;margin-left:2px}
.ml-chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.ml-chip[aria-pressed="true"] em{color:var(--surface);opacity:.85}
.ml-bar{display:flex;gap:6px;flex-wrap:wrap}
.ml-bar input{flex:1;min-width:160px;font:inherit;font-size:.85rem;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg)}
.ml-list{display:flex;flex-direction:column;gap:4px;max-height:520px;overflow-y:auto}
.ml-p{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer}
.ml-p span{flex:1;min-width:0;display:flex;flex-direction:column}
.ml-p b{font-size:.88rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ml-p small{color:var(--muted);font-size:.75rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ml-p.off{opacity:.6;cursor:default}
.ml-p .dl{flex:none;font-size:.72rem;padding:4px 9px}
.ml-sh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.ml-sh h3{margin-right:auto}
.ml-sh input,.mv-list input{font:inherit;font-size:.85rem;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg);min-width:220px}
.ml-si{cursor:pointer}.ml-si:hover{border-color:var(--accent)}.ml-si small{display:block}.ml-cnt{margin-top:2px}
.rc{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.rc.read{background:#dcefe4;color:#17663f}.rc.ok{background:var(--accent-soft);color:var(--fg)}.rc.wait{background:var(--line);color:var(--muted)}.rc.bad,.rc.spam{background:#fde4e1;color:#b42318}
.mv-grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;align-items:start}.mv-grid.one{grid-template-columns:1fr}
@media (max-width:760px){.mv-grid{grid-template-columns:1fr}}
.mv-list{display:flex;flex-direction:column;gap:5px;max-height:70vh;overflow-y:auto}.mv-list input{min-width:0;margin-bottom:4px}
.mv-p{font:inherit;text-align:left;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.mv-p[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mv-p b{font-size:.86rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mv-p small{color:var(--muted);font-size:.74rem;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.mv-rc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.mv-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mv-st{display:flex;flex-direction:column;gap:2px;font-size:.84rem}.mv-st i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:.75rem;font-weight:800}
.mv-st.on i{background:#1f9d63;border-color:#1f9d63;color:#fff}.mv-st small{color:var(--muted);font-size:.74rem}
.mv-warn{margin:0;color:#b42318;font-size:.85rem;font-weight:600}
.mv-rc summary{cursor:pointer;color:var(--accent);font-size:.84rem;font-weight:600}
.mv-tl{margin:8px 0 0;padding-left:18px;font-size:.82rem;display:flex;flex-direction:column;gap:4px}.mv-tl small{color:var(--muted)}
.mv-hdr{background:var(--surface);border:1px solid var(--line);border-radius:12px 12px 0 0;padding:10px 14px;font-size:.84rem;display:flex;flex-direction:column;gap:3px;word-break:break-word}
.mv-hdr span{display:inline-block;width:70px;color:var(--muted)}
.mv-tabs{background:var(--surface);border:1px solid var(--line);border-top:0;padding:8px 14px}
.mv-frame{display:block;width:100%;min-height:260px;border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;background:#fff}
.mv-txt{white-space:pre-wrap;font:inherit;font-size:.88rem;margin:0;background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;padding:14px}

const fmtDur=s=>!s?"–":s<60?s+"s":Math.floor(s/60)+"m "+String(s%60).padStart(2,"0")+"s";

async function api(path){
  const r=await fetch("/api/admin/"+path,{headers:{"x-admin-key":KEY}});
  if(r.status===401) throw new Error("auth");
  const j=await r.json(); if(!j.ok) throw new Error(j.error||"Request failed"); return j.rows;
}
async function load(){
  const days = range===0?3650:Math.max(range,1);
  try{
    if(tab==="chat"){ await chatList(); render(); return; }
    if(tab==="mail"){ if(!data.mail||ml.reload){ ml.reload=false; data.mail=await chatFetch("mail"); mailInit(); render(); } else if(!$("#mlForm")) render(); return; }

    else if(tab==="analytics") data.visits=await api("visits?days="+days);
    else if(tab==="news"){ if(newsEdit) return; data.news=await api("news"); }

    else if(tab==="forum"){
      const r=await fetch("/api/admin/forum",{headers:{"x-admin-key":KEY}});

      if(forumF==="views"){ const v=await fetch("/api/admin/forum-views?days="+days+(fvTopic?"&topic="+encodeURIComponent(fvTopic.id):""),{headers:{"x-admin-key":KEY}}); const vj=await v.json(); data.fviews=vj.ok?vj.rows:null; data.fviewsErr=vj.ok?"":(vj.error||"Couldn't load views"); }
    }
    else if(tab==="study"){ if(soEdit) return; data.study=await soGet("study"); }

      const r=await fetch("/api/admin/students",{headers:{"x-admin-key":KEY}});

function lock(msg){ KEY=""; try{sessionStorage.removeItem("wp_admin");}catch(e){} $("#app").hidden=true; $("#gate").hidden=false; $("#gErr").textContent=msg||""; }

/* ---------- Live visitors (unique visitors, Edmonton time; refreshed every 30 seconds) ---------- */
let vsIv=null; const vsShown={};
function vsAnim(el,to){ const from=vsShown[el.dataset.k]??0; vsShown[el.dataset.k]=to; const f0=n=>Number(n||0).toLocaleString("en-CA");
  if(from===to||matchMedia("(prefers-reduced-motion: reduce)").matches){ el.textContent=f0(to); return; }
  const t0=performance.now(); const step=t=>{ const k=Math.min(1,(t-t0)/800); el.textContent=f0(Math.round(from+(to-from)*(1-Math.pow(1-k,3)))); if(k<1) requestAnimationFrame(step); }; requestAnimationFrame(step); }
async function vsLoad(){

function seg(name,opts,cur,cb){ return `<div class="wpa-seg" data-seg="${name}">${opts.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${String(v)===String(cur)}">${l}</button>`).join("")}</div>`; }
function controls(){

      :seg("page",[["all","All pages"],["home","Home"],["questionnaire","Questionnaire"]],pageF));

    c.querySelectorAll('[data-seg="suf"] button').forEach(b=>b.onclick=()=>{suF=b.dataset.v; suOpen=null; suShown=100; controls(); render();});

    c.querySelectorAll('[data-seg="page"] button').forEach(b=>b.onclick=()=>{pageF=b.dataset.v; controls(); render();});
  } else if(tab==="study"){
    c.innerHTML=seg("sof",[["programs","Programs"],["schools","Schools"],["import","Import"]],soF)+`<input id="soQ" type="search" placeholder="Search school, program, city" value="${esc(soQ)}" style="font:inherit;font-size:.85rem;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg);min-width:200px"><label style="font-size:.85rem;display:inline-flex;gap:6px;align-items:center"><input type="checkbox" id="soAb"${soAb?" checked":""}> ApplyBoard only</label><button class="dl" type="button" id="soAddP">+ Add program</button><button class="dl" type="button" id="soAddS">+ Add school</button>`;
    c.querySelectorAll('[data-seg="sof"] button').forEach(b=>b.onclick=()=>{ soF=b.dataset.v; soEdit=null; controls(); render(); });

  } else if(tab==="students"){
    c.innerHTML=seg("stf",[["open","To do"],["shortlisted","Shortlisted"],["new","New"],["working","Working"],["options-sent","Options sent"],["closed","Closed"],["all","All"]],stF)+`<input id="stQ" type="search" placeholder="Search name, email, course…" value="${esc(stQ)}" style="font:inherit;font-size:.85rem;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg);min-width:200px"><a class="dl" href="/student-pool/" target="_blank" rel="noopener" style="text-decoration:none">Open Student Pool ↗</a>`;
    c.querySelectorAll('[data-seg="stf"] button').forEach(b=>b.onclick=()=>{ stF=b.dataset.v; controls(); render(); });
    $("#stQ").oninput=e=>{ stQ=e.target.value; render(); };
  } else if(tab==="scanner"){
    c.innerHTML=`<a class="dl" href="/tools/profile-scanner/" target="_blank" rel="noopener" style="text-decoration:none">Open the scanner ↗</a><button class="dl" type="button" id="spAdd">+ Free pass</button>`;
    $("#spAdd").onclick=()=>{ spForm=!spForm; render(); };
  } else if(tab==="news"){
    c.innerHTML=seg("nf",[["live","Live"],["archived","Archived"],["all","All"]],newsF)+`<button class="dl" type="button" id="nwAdd">+ Add item</button>`;
    c.querySelectorAll('[data-seg="nf"] button').forEach(b=>b.onclick=()=>{ newsF=b.dataset.v; newsEdit=null; controls(); render(); });
    $("#nwAdd").onclick=()=>{ newsEdit={}; render(); };
  } else if(tab==="draws"){
    c.innerHTML=seg("df",[["all","All"],["edited","Edited"],["manual","Added by hand"],["hidden","Hidden"],["sources","Sources"]],drF)+`<input id="drQ" type="search" placeholder="Search program or stream" value="${esc(drQ)}" style="font:inherit;font-size:.85rem;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg);min-width:200px"><button class="dl" type="button" id="drAdd">+ Add draw</button><button class="dl" type="button" id="drRefresh" title="Read every official page again now">↻ Refresh now</button><a class="dl" href="https://github.com/gillonline01313/workerpool/actions/workflows/draws.yml" target="_blank" rel="noopener" style="text-decoration:none" title="Fallback: run the reader on GitHub">Run on GitHub ↗</a>`;
    c.querySelectorAll('[data-seg="df"] button').forEach(b=>b.onclick=()=>{ drF=b.dataset.v; drEdit=null; controls(); render(); });
    $("#drQ").oninput=e=>{ drQ=e.target.value; render(); };
    $("#drAdd").onclick=()=>{ drEdit={date:new Date().toLocaleDateString("en-CA",{timeZone:"America/Edmonton"})}; render(); };

  } else if(tab==="forum"){
    c.innerHTML=seg("ff",[["reports","Reports"],["topics","Topics"],["posts","Latest posts"],["views","Views"]],forumF)+(forumF==="views"?seg("fr",[["1","24 h"],["7","7 days"],["30","30 days"],["365","1 year"]],String(range)):"")+`<a class="dl" href="/forum/" target="_blank" rel="noopener" style="text-decoration:none">Open forum ↗</a>`;

function csv(t){
  const rows=data[t]||[]; if(!rows.length) return;
  const cols=Object.keys(rows[0]).filter(k=>k!=="profile");
  const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const text=[cols.join(","),...rows.map(r=>cols.map(c=>q(r[c])).join(","))].join("\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:"text/csv"}));
  a.download=`workerpool-${t}-${new Date().toISOString().slice(0,10)}.csv`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function count(arr){ const m=new Map(); arr.forEach(k=>m.set(k,(m.get(k)||0)+1)); return [...m.entries()].sort((a,b)=>b[1]-a[1]); }
/* drill-down registry: each clickable number points at the visits behind it */
let DR=new Map(), drN=0;
const reg=(title,visits,opt)=>{ const id="d"+(++drN); DR.set(id,{title,visits,...(opt||{})}); return id; };
const drAttr=id=>id?` data-drill="${id}" role="button" tabindex="0"`:"";
// groups visits by key (a key function may return an array): [[label, count, visits], ...]
function grp(V,fn){ const m=new Map(); V.forEach(v=>{ let k=fn(v); (Array.isArray(k)?[...new Set(k)]:[k]).forEach(x=>{ if(x==null||x==="") return; if(!m.has(x)) m.set(x,[]); m.get(x).push(v); }); }); return [...m.entries()].map(([k,a])=>[k,a.length,a]).sort((a,b)=>b[1]-a[1]); }
const drill=(list,title,opt)=>list.map(([l,n,vs])=>[l,n,reg(title+": "+l,vs,typeof opt==="function"?opt(l):opt)]);
function bars(list,total){
  if(!list.length) return `<p class="wpa-note">No data in this period.</p>`;
  const max=Math.max(1,...list.map(x=>x[1]));
  return `<div class="wpa-bars">${list.map(([l,v,id])=>`<div class="wpa-row"${drAttr(id)}${id?` aria-label="${esc(l)}: ${v}. Show details"`:""}><span class="l" title="${esc(l)}">${esc(l)}</span><span class="t"><i style="width:${(v/max*100).toFixed(1)}%"></i></span><span class="v">${total?Math.round(v/total*100)+"%":v}</span></div>`).join("")}</div>`;
}
function colChart(values,labels,every,tipFmt,ids){
  const W=720,H=180,pl=34,pr=8,pt=10,pb=26,n=values.length,max=Math.max(1,...values);
  const step=Math.max(1,Math.ceil(max/4)),top=step*Math.ceil(max/step),bw=(W-pl-pr)/n,y=v=>pt+(H-pt-pb)*(1-v/top);
  let g="";for(let v=0;v<=top;v+=step)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const b=values.map((v,i)=>{const h=Math.max(0,y(0)-y(v)),x=pl+i*bw+bw*.18,w=Math.max(2,bw*.64);return v?`<rect class="b" x="${x.toFixed(1)}" y="${(y(0)-h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="3" data-tip="${esc(tipFmt(i,v))}${ids&&ids[i]?" · click for details":""}"${ids&&ids[i]?` data-drill="${ids[i]}"`:""}/>`:"";}).join("");
  const lx=labels.map((l,i)=>i%every===0?`<text x="${(pl+i*bw+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`:"").join("");
  return `<div class="wpa-chart"><svg viewBox="0 0 ${W} ${H}" role="img">${g}${b}${lx}</svg></div>`;
}
function wireTips(root){
  root.querySelectorAll(".wpa-chart").forEach(c=>{const tip=document.createElement("div");tip.className="wpa-tip";tip.hidden=true;c.appendChild(tip);
    c.addEventListener("pointermove",e=>{const r=e.target.closest("rect.b");if(!r){tip.hidden=true;return;}const cr=c.getBoundingClientRect(),rr=r.getBoundingClientRect();tip.textContent=r.dataset.tip;tip.hidden=false;tip.style.left=(rr.left-cr.left+rr.width/2+c.scrollLeft)+"px";tip.style.top=(rr.top-cr.top)+"px";});
    c.addEventListener("pointerleave",()=>tip.hidden=true);});

const J=s=>{try{return JSON.parse(s||"[]")}catch(e){return []}};
/* ---------- drill-down panel ---------- */

function drRows(){
  const d=drState, q=d.q.trim().toLowerCase();

function soParse(txt){ // tab-separated (pasted cells) or CSV with quotes
  const t=String(txt||"").trim(); if(!t) return [];
  const sep=t.split("\n")[0].includes("\t")?"\t":",", rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<t.length;i++){ const ch=t[i];
    if(q){ if(ch==='"'&&t[i+1]==='"'){ cur+='"'; i++; } else if(ch==='"') q=false; else cur+=ch; continue; }
    if(ch==='"') q=true; else if(ch===sep){ row.push(cur); cur=""; } else if(ch==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; } else if(ch!=="\r") cur+=ch; }
  row.push(cur); rows.push(row);
  const head=rows.shift().map(h=>h.trim().toLowerCase().replace(/[^a-z_]+/g,"_").replace(/^_|_$/g,"")).map(h=>h==="program_name"||h==="name"?"program":h==="school_name"||h==="college"||h==="institution"?"school":h);
  return rows.filter(r=>r.some(c=>c.trim())).map(r=>{ const o={}; head.forEach((h,i)=>o[h]=(r[i]||"").trim()); o.name=o.program; return o; });
}

async function drRefresh(ids){

  const b=$("#drRefresh"); if(b) b.disabled=true;
  try{ const j=await newsPost("draws-refresh",{sources:ids||[]}); drRun={at:j.at,ids:j.sources||[],state:"queued",msg:"Starting the reader…"}; if(tab==="draws"&&!drEdit) render(); drRun.timer=setTimeout(drPoll,8000); }

async function drResume(){ // a refresh started earlier (another tab, or before a page reload) is still going

async function drPoll(){
  const r=drRun; if(!r) return; clearTimeout(r.timer);
  const since=new Date(r.at).getTime();
  try{
    if(r.state==="queued"||r.state==="running"){
      const j=await drGet("draws-refresh");
      const run=(j.runs||[]).filter(x=>x.event==="workflow_dispatch"&&new Date(x.created).getTime()>=since-90000).pop();
      if(run){ r.url=run.url;
        if(run.status!=="completed"){ r.state="running"; r.msg=run.status==="queued"?"Waiting for GitHub to start (another update may be running first)…":"Reading the official pages…"; }
        else if(run.conclusion==="success"){ r.state="deploying"; r.doneAt=Date.now(); r.msg="Finished reading. Publishing to the site (about 1–2 minutes)…"; }
        else { r.state="failed"; r.msg="The refresh didn't finish ("+esc(run.conclusion||"failed")+"). Open the details to see why, or try again."; }
      } else if(Date.now()-since>4*60000){ r.state="failed"; r.msg="GitHub didn't start the refresh. Try again, or use “Run on GitHub ↗”."; }
    }
    if(r.state==="deploying"){
      const d=await drGet("draws"), want=r.ids.length?r.ids:(d.sources||[]).filter(s=>!s.manual).map(s=>s.id);

        data.draws=d; r.state="done";

          :`${good.length} sources read, ${bad.length} failed${bad.length?": "+bad.map(s=>esc(s.program)).join(", "):""}.`)
          +(bad.length?" If the page is down, enter the draw by hand with “+ Add draw”.":" The home page now shows the latest scores.");
        if(bad.length) r.state="failed";
      } else if(Date.now()-r.doneAt>6*60000){ r.state="done"; r.msg="The reader finished, but the site hasn't published the new data yet. It normally appears within a few minutes: reload this tab later."; }
    }
  }catch(x){ if(x.message==="auth") return lock("That admin key isn't right."); }
  if(drRun===r&&drLive(r)) r.timer=setTimeout(drPoll,r.state==="deploying"?15000:10000);

}

}
const fixDur=(a)=>{ a.addEventListener("loadedmetadata",()=>{ if(a.duration===Infinity){ const t=()=>{ a.removeEventListener("timeupdate",t); a.currentTime=0; }; a.addEventListener("timeupdate",t); a.currentTime=1e101; } },{once:true}); };
function chatAudio(root){ root.querySelectorAll("audio[data-chataudio]").forEach(async a=>{ try{ fixDur(a); a.src=await chatBlob(a.dataset.chataudio); }catch(e){ a.replaceWith(Object.assign(document.createElement("small"),{textContent:"Couldn't load this voice note."})); } }); }
function chatImgs(root){ root.querySelectorAll("img[data-chatimg]").forEach(async i=>{ try{ i.src=await chatBlob(i.dataset.chatimg); i.onload=()=>{ const b=$("#chatMsgs"); if(b) b.scrollTop=b.scrollHeight; }; }catch(e){ i.alt="Couldn't load image"; } }); }
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-chatfile],img[data-chatimg]"); if(!el) return;
  try{ const u=await chatBlob(el.dataset.chatfile||el.dataset.chatimg); const a=document.createElement("a"); a.href=u; a.download=el.dataset.name||"file"; a.click(); }
  catch(x){ $("#chatErr").textContent=x.message; }
});
async function chatUpload(files){
  const c=$("#chatClip"), err=$("#chatErr"); c.disabled=true; err.textContent="";
  for(let i=0;i<files.length;i++){ const f=files[i];
    if(f.size>10485760){ err.textContent=`${f.name} is over 10 MB.`; continue; }
    c.textContent=`Sending ${i+1}/${files.length}…`;
    try{ const r=await fetch("/api/admin/chat-file",{method:"POST",headers:{"x-admin-key":KEY,"x-thread-id":chat.cur,"x-file-name":encodeURIComponent(f.name),"content-type":"application/octet-stream"},body:f});
      const j=await r.json().catch(()=>({})); if(!r.ok||!j.ok) err.textContent=`${f.name}: ${j.error||"couldn't send."}`;
      else if(j.emailed) err.innerHTML=`<span style="color:var(--muted)">They've left the page, so we emailed them that a file is waiting in the chat.</span>`;
    }catch(x){ err.textContent=`${f.name}: couldn't send.`; }
  }
  c.textContent="Attach"; c.disabled=false; await chatThread();
}
async function chatSend(){
  const t=$("#chatText"), b=$("#chatSend"), text=t.value.trim(); if(!text) return;
  b.disabled=true; $("#chatErr").textContent="";
  try{ const j=await chatFetch("chat-reply",{method:"POST",body:JSON.stringify({id:chat.cur,body:text})}); t.value=""; await chatThread();
    if(j.emailed) $("#chatErr").innerHTML=`<span style="color:var(--muted)">They've left the page, so your reply was also emailed to them.</span>`;
  }catch(e){ $("#chatErr").textContent=e.message==="auth"?"Admin key expired. Unlock again.":e.message; }
  b.disabled=false; t.focus();
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("button[data-docid]"); if(!b) return;
  const label=b.textContent; b.disabled=true; b.textContent="Downloading…";
  try{
    const r=await fetch("/api/admin/b2b-doc?id="+encodeURIComponent(b.dataset.docid),{headers:{"x-admin-key":KEY}});
    if(!r.ok){ let j={}; try{j=await r.json();}catch(x){} throw new Error(j.error||"Download failed."); }
    const a=document.createElement("a"); a.href=URL.createObjectURL(await r.blob()); a.download=b.dataset.name||"document"; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000); b.textContent=label;
  }catch(x){ b.textContent=x.message; }
  b.disabled=false;
});
if(KEY) start();
})();
</script>
</body>
</html>
