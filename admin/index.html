<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin · WorkerPool</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--bg:#f3f6f5;--surface:#fff;--fg:#1b2628;--muted:#5a696b;--line:#d3dcda;--accent:#3f7a72;--accent-soft:#dcebe7;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--body:"Figtree","Segoe UI",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121819;--surface:#1d2729;--fg:#e3ebe9;--muted:#97a7a5;--line:#2c3a3c;--accent:#7fbcb2;--accent-soft:#213431;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px}

/* WorkerPool analytics: owner-only dashboard */
.wpa-entry{font:inherit;font-size:.82rem;font-weight:600;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 12px;cursor:pointer}
.wpa-entry:hover{color:var(--fg);border-color:var(--fg)}
.wpa-ov{background:var(--bg);overflow-y:auto;padding-block:max(16px,env(safe-area-inset-top,0px)) max(32px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-family:var(--body);color:var(--fg)}
.wpa{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.wpa-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.wpa-top h2{font-family:var(--display);font-size:1.6rem;font-weight:650;margin:0;letter-spacing:-.01em}
.wpa-top p{margin:2px 0 0;color:var(--muted);font-size:.85rem}
.wpa-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wpa-seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.wpa-seg button{font:inherit;font-size:.82rem;font-weight:600;border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer}
.wpa-seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.wpa-close{font:inherit;font-weight:600;font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 14px;cursor:pointer}
.wpa-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.wpa-kpis{grid-template-columns:1fr 1fr}}
.wpa-kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.wpa-kpi small{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.wpa-kpi b{display:block;font-family:var(--display);font-size:1.9rem;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:4px}
.wpa-kpi span{font-size:.8rem;color:var(--muted)}
.wpa-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:820px){.wpa-grid{grid-template-columns:1fr}}
.wpa-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.wpa-card.wide{grid-column:1/-1}
.wpa-card h3{font-family:var(--display);font-size:1rem;font-weight:600;margin:0}
.wpa-card .sub{font-size:.8rem;color:var(--muted);margin-top:-8px}
.wpa-bars{display:flex;flex-direction:column;gap:7px}
.wpa-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 46px;gap:10px;align-items:center;font-size:.85rem}
.wpa-row .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wpa-row .t{height:8px;border-radius:4px;background:var(--accent-soft);overflow:hidden}
.wpa-row .t i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.wpa-row .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.wpa-chart{position:relative;overflow-x:auto}
.wpa-chart svg{display:block;width:100%;min-width:520px;height:auto}
.wpa-chart rect.b{fill:var(--accent)}
.wpa-chart rect.b:hover{opacity:.75}
.wpa-chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.wpa-chart line{stroke:var(--line)}
.wpa-tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:.75rem;padding:4px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%)}
.wpa-tbl{overflow-x:auto}
.wpa-tbl table{width:100%;border-collapse:collapse;font-size:.82rem;min-width:620px}
.wpa-tbl th{text-align:left;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.wpa-tbl td{padding:8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.wpa-empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:28px;color:var(--muted);text-align:center}
.wpa-note{font-size:.78rem;color:var(--muted)}

.gate{max-width:380px;margin:12vh auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:14px}
.gate h1{font-family:var(--display);margin:0;font-size:1.5rem}
.gate input{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.gate button,.dl{font:inherit;font-weight:600;padding:11px 16px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:var(--surface);cursor:pointer}
.dl{padding:7px 14px;font-size:.82rem;background:transparent;color:var(--fg);border-color:var(--line)}
.err{color:#b4552d;font-size:.85rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:inherit;font-weight:600;font-size:.88rem;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{color:var(--fg);border-color:var(--fg)}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--fg)}
.wpa-tbl td details summary{cursor:pointer;color:var(--accent)}
.wpa-tbl pre{white-space:pre-wrap;font-size:.75rem;max-width:520px}
.chat-grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:12px;min-height:480px}
@media (max-width:760px){.chat-grid{grid-template-columns:1fr}}
.chat-list{display:flex;flex-direction:column;gap:6px;max-height:640px;overflow-y:auto}
.chat-item{font:inherit;text-align:left;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.chat-item[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chat-item .r1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.chat-item small{color:var(--muted);font-size:.75rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-unread{background:#d4572f;color:#fff;border-radius:999px;font-size:.7rem;font-weight:700;padding:1px 7px}
.chat-conv{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:480px}
.chat-top{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chat-top small{display:block;color:var(--muted);font-size:.78rem}
.chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg);max-height:520px}
.chat-m{max-width:80%;padding:8px 12px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word;font-size:.9rem}
.chat-m small{display:block;font-size:.7rem;opacity:.7;margin-top:2px}
.chat-m.v{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.chat-m.a{align-self:flex-end;background:var(--accent);color:var(--surface)}
.chat-reply{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);align-items:flex-end}
.chat-reply textarea{flex:1;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);resize:vertical;min-height:44px}
.chat-file{display:flex;align-items:center;gap:8px;font:inherit;font-weight:600;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.chat-file em{font-style:normal;font-weight:400;opacity:.75;font-size:.78rem}
.chat-img{display:block;max-width:260px;max-height:200px;border-radius:9px;margin:2px 0;cursor:pointer}
.chat-clip{flex:none;font:inherit;font-weight:600;font-size:.82rem;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chat-live{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted)}
.chat-live i{width:9px;height:9px;border-radius:50%;background:#3fae6c}
.chat-live i.off{background:#b9c2c1}
.chat-voice{display:flex;flex-direction:column;gap:6px;min-width:260px}
.chat-voice audio{width:100%;height:40px}
.nw-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.nw-form{grid-template-columns:1fr}}
.nw-form label{display:flex;flex-direction:column;gap:5px;font-size:.82rem;font-weight:600}
.nw-form .full{grid-column:1/-1}
.nw-form input,.nw-form select,.nw-form textarea{font:inherit;font-weight:400;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.nw-form .chk{flex-direction:row;align-items:center;gap:8px}
.nw-acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nw-list{display:flex;flex-direction:column;gap:10px}
.nw-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--bg)}
.nw-item.arch{opacity:.7}
.nw-item b{display:block;font-size:.95rem}
.nw-item small{color:var(--muted);font-size:.78rem}
.nw-tag{display:inline-block;font-size:.66rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:5px;margin-right:6px;vertical-align:1px}
.nw-tag.hot{background:#ff5a36;color:#fff}.nw-tag.new{background:#ffd23f;color:#2a2100}.nw-tag.trending{background:#7c5cff;color:#fff}.nw-tag.update{background:var(--accent-soft);color:var(--fg)}
.nw-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
</style>
</head>
<body>
<div class="wpa-ov">
<form class="gate" id="gate">
  <h1>WorkerPool admin</h1>
  <p style="margin:0;color:var(--muted)">Enter the admin key you set in Cloudflare.</p>
  <input id="key" type="password" autocomplete="current-password" placeholder="Admin key">
  <div class="err" id="gErr"></div>
  <button type="submit">Open dashboard</button>
</form>
<div class="wpa" id="app" hidden>
  <div class="wpa-top"><div><h2>WorkerPool admin</h2><p>Live data from workerpool.ca. Refreshes every minute.</p></div>
    <div class="wpa-ctl"><div class="tabs" id="tabs">
      <button type="button" data-t="analytics" aria-pressed="true">Analytics</button>
      <button type="button" data-t="news" aria-pressed="false">Hot &amp; New</button>
      <button type="button" data-t="submissions" aria-pressed="false">Candidates</button>
      <button type="button" data-t="interest" aria-pressed="false">Employer interest</button>
      <button type="button" data-t="b2b" aria-pressed="false">B2B applications</button>
      <button type="button" data-t="assessments" aria-pressed="false">Shared assessments</button>
      <button type="button" data-t="forum" aria-pressed="false">Forum</button>
      <button type="button" data-t="chat" aria-pressed="false" id="chatTab">Live chat</button></div>
      <button class="wpa-close" type="button" id="out">Lock</button></div></div>
  <div id="ctl" class="wpa-ctl"></div>
  <div id="wpaBody"></div>
</div>
</div>
<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDur=s=>!s?"–":s<60?s+"s":Math.floor(s/60)+"m "+String(s%60).padStart(2,"0")+"s";
const when=t=>new Date(t).toLocaleString("en-CA",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
let KEY=""; try{KEY=sessionStorage.getItem("wp_admin")||"";}catch(e){}
let fvTopic=null, forumF="reports", tab="analytics", range=7, pageF="all", data={}, newsF="live", newsEdit=null;
async function api(path){
  const r=await fetch("/api/admin/"+path,{headers:{"x-admin-key":KEY}});
  if(r.status===401) throw new Error("auth");
  const j=await r.json(); if(!j.ok) throw new Error(j.error||"Request failed"); return j.rows;
}
async function load(){
  const days = range===0?3650:Math.max(range,1);
  try{
    if(tab==="chat"){ await chatList(); render(); return; }
    if(tab==="analytics") data.visits=await api("visits?days="+days);
    else if(tab==="news"){ if(newsEdit) return; data.news=await api("news"); }
    else if(tab==="forum"){
      const r=await fetch("/api/admin/forum",{headers:{"x-admin-key":KEY}});
      if(r.status===401) throw new Error("auth");
      const j=await r.json(); if(!j.ok) throw new Error(j.error||"Request failed"); data.forum=j;
      if(forumF==="views"){ const v=await fetch("/api/admin/forum-views?days="+days+(fvTopic?"&topic="+encodeURIComponent(fvTopic.id):""),{headers:{"x-admin-key":KEY}}); const vj=await v.json(); data.fviews=vj.ok?vj.rows:null; data.fviewsErr=vj.ok?"":(vj.error||"Couldn't load views"); }
    }
    else if(tab==="b2b"){
      const r=await fetch("/api/admin/b2b",{headers:{"x-admin-key":KEY}});
      if(r.status===401) throw new Error("auth");
      const j=await r.json(); if(!j.ok) throw new Error(j.error||"Request failed");
      data.b2b=j.rows; data.b2bDocs=j.docs;
      if(!window.B2B){ try{ window.B2B=await import("/assets/b2b-config.js"); }catch(e){ window.B2B=null; } }
    }
    else data[tab]=await api(tab);
    render();
  }catch(e){
    if(e.message==="auth"){ lock("That admin key isn't right."); return; }
    $("#wpaBody").innerHTML=`<div class="wpa-empty">Couldn't load data: ${esc(e.message)}</div>`;
  }
}
function lock(msg){ KEY=""; try{sessionStorage.removeItem("wp_admin");}catch(e){} $("#app").hidden=true; $("#gate").hidden=false; $("#gErr").textContent=msg||""; }
$("#gate").onsubmit=e=>{ e.preventDefault(); KEY=$("#key").value.trim(); if(!KEY) return; try{sessionStorage.setItem("wp_admin",KEY);}catch(x){} start(); };
$("#out").onclick=()=>lock("");
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{ tab=b.dataset.t; newsEdit=null; document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-pressed",x===b)); controls(); $("#wpaBody").innerHTML=`<div class="wpa-empty">Loading…</div>`; load(); });
let iv=null;
function start(){ $("#gate").hidden=true; $("#app").hidden=false; controls(); load(); clearInterval(iv); iv=setInterval(load,60000); chatStart(); }
function seg(name,opts,cur,cb){ return `<div class="wpa-seg" data-seg="${name}">${opts.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${String(v)===String(cur)}">${l}</button>`).join("")}</div>`; }
function controls(){
  const c=$("#ctl");
  if(tab==="analytics"){
    c.innerHTML=seg("range",[[1,"Today"],[7,"7 days"],[30,"30 days"],[90,"90 days"],[0,"All"]],range)+seg("page",[["all","All pages"],["home","Home"],["questionnaire","Questionnaire"]],pageF);
    c.querySelectorAll('[data-seg="range"] button').forEach(b=>b.onclick=()=>{range=+b.dataset.v; controls(); load();});
    c.querySelectorAll('[data-seg="page"] button').forEach(b=>b.onclick=()=>{pageF=b.dataset.v; controls(); render();});
  } else if(tab==="news"){
    c.innerHTML=seg("nf",[["live","Live"],["archived","Archived"],["all","All"]],newsF)+`<button class="dl" type="button" id="nwAdd">+ Add item</button>`;
    c.querySelectorAll('[data-seg="nf"] button').forEach(b=>b.onclick=()=>{ newsF=b.dataset.v; newsEdit=null; controls(); render(); });
    $("#nwAdd").onclick=()=>{ newsEdit={}; render(); };
  } else if(tab==="forum"){
    c.innerHTML=seg("ff",[["reports","Reports"],["topics","Topics"],["posts","Latest posts"],["views","Views"]],forumF)+(forumF==="views"?seg("fr",[["1","24 h"],["7","7 days"],["30","30 days"],["365","1 year"]],String(range)):"")+`<a class="dl" href="/forum/" target="_blank" rel="noopener" style="text-decoration:none">Open forum ↗</a>`;
    c.querySelectorAll('[data-seg="ff"] button').forEach(b=>b.onclick=()=>{ forumF=b.dataset.v; if(forumF!=="views") fvTopic=null; controls(); forumF==="views"?load():render(); });
    c.querySelectorAll('[data-seg="fr"] button').forEach(b=>b.onclick=()=>{ range=+b.dataset.v; controls(); load(); });
  } else if(tab==="chat"){
    c.innerHTML=`<span class="chat-live"><i id="chatDot"></i><span id="chatHrs"></span></span>`; chatStatus();
  } else {
    c.innerHTML=`<button class="dl" type="button" id="csv">Download CSV</button>`;
    $("#csv").onclick=()=>csv(tab);
  }
}
function csv(t){
  const rows=data[t]||[]; if(!rows.length) return;
  const cols=Object.keys(rows[0]).filter(k=>k!=="profile");
  const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const text=[cols.join(","),...rows.map(r=>cols.map(c=>q(r[c])).join(","))].join("\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:"text/csv"}));
  a.download=`workerpool-${t}-${new Date().toISOString().slice(0,10)}.csv`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function count(arr){ const m=new Map(); arr.forEach(k=>m.set(k,(m.get(k)||0)+1)); return [...m.entries()].sort((a,b)=>b[1]-a[1]); }
function bars(list,total){
  if(!list.length) return `<p class="wpa-note">No data in this period.</p>`;
  const max=Math.max(1,...list.map(x=>x[1]));
  return `<div class="wpa-bars">${list.map(([l,v])=>`<div class="wpa-row"><span class="l" title="${esc(l)}">${esc(l)}</span><span class="t"><i style="width:${(v/max*100).toFixed(1)}%"></i></span><span class="v">${total?Math.round(v/total*100)+"%":v}</span></div>`).join("")}</div>`;
}
function colChart(values,labels,every,tipFmt){
  const W=720,H=180,pl=34,pr=8,pt=10,pb=26,n=values.length,max=Math.max(1,...values);
  const step=Math.max(1,Math.ceil(max/4)),top=step*Math.ceil(max/step),bw=(W-pl-pr)/n,y=v=>pt+(H-pt-pb)*(1-v/top);
  let g="";for(let v=0;v<=top;v+=step)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const b=values.map((v,i)=>{const h=Math.max(0,y(0)-y(v)),x=pl+i*bw+bw*.18,w=Math.max(2,bw*.64);return v?`<rect class="b" x="${x.toFixed(1)}" y="${(y(0)-h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="3" data-tip="${esc(tipFmt(i,v))}"/>`:"";}).join("");
  const lx=labels.map((l,i)=>i%every===0?`<text x="${(pl+i*bw+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`:"").join("");
  return `<div class="wpa-chart"><svg viewBox="0 0 ${W} ${H}" role="img">${g}${b}${lx}</svg></div>`;
}
function wireTips(root){
  root.querySelectorAll(".wpa-chart").forEach(c=>{const tip=document.createElement("div");tip.className="wpa-tip";tip.hidden=true;c.appendChild(tip);
    c.addEventListener("pointermove",e=>{const r=e.target.closest("rect.b");if(!r){tip.hidden=true;return;}const cr=c.getBoundingClientRect(),rr=r.getBoundingClientRect();tip.textContent=r.dataset.tip;tip.hidden=false;tip.style.left=(rr.left-cr.left+rr.width/2+c.scrollLeft)+"px";tip.style.top=(rr.top-cr.top)+"px";});
    c.addEventListener("pointerleave",()=>tip.hidden=true);});
}
const J=s=>{try{return JSON.parse(s||"[]")}catch(e){return []}};
const place=v=>v.city?`${v.city}, ${v.country||"?"}`:(v.country||(v.tz&&v.tz.split("/").pop().replace(/_/g," "))||"Unknown");

function render(){
  const body=$("#wpaBody");
  if(tab==="interest") return renderInterest(body);
  if(tab==="submissions") return renderSubs(body);
  if(tab==="b2b") return renderB2B(body);
  if(tab==="assessments") return renderAssess(body);
  if(tab==="chat") return renderChat(body);
  if(tab==="news") return renderNews(body);
  if(tab==="forum") return renderForum(body);
  const now=new Date(), startDay=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const from=range===0?0:range===1?startDay.getTime():startDay.getTime()-(range-1)*864e5;

      <small style="display:block">📱 ${esc([v.dev,v.os,v.browser].filter(Boolean).join(" · "))}${v.screen?" · "+esc(v.screen):""}${v.lang?" · "+esc(v.lang):""}</small>
      ${fvTopic?"":`<small style="display:block">💬 ${tl(v.topic_id)}${esc(v.title||"(deleted topic)")}</a></small>`}</div></div>`).join(""):`<div class="wpa-empty">No views recorded in this period yet. Views are recorded from now on.</div>`}</div></div>`;
  const a=$("#fvAll"); if(a) a.onclick=e=>{ e.preventDefault(); fvTopic=null; load(); };
}
/* ---------- Hot & New ticker ---------- */
const NTAG={hot:"Hot",new:"New",trending:"Trending",update:"Update"};
async function newsPost(route,body){
  const r=await fetch("/api/admin/"+route,{method:"POST",headers:{"x-admin-key":KEY,"content-type":"application/json"},body:JSON.stringify(body)});
  if(r.status===401) throw new Error("auth");
  const j=await r.json(); if(!j.ok) throw new Error(j.error||"Couldn't save"); return j;
}
function renderNews(body){
  if(newsEdit) return newsForm(body);
  const all=data.news||[], live=all.filter(r=>r.status!=="archived").length;
  const today=new Date().toISOString().slice(0,10);
  const R=all.filter(r=>newsF==="all"||(newsF==="archived"?r.status==="archived":r.status!=="archived"));
  const head=`<h3>${live} live item${live===1?"":"s"} on the homepage ticker · ${all.length-live} archived</h3>
    <p class="sub" style="color:var(--muted);font-size:.85rem;margin:4px 0 14px">Pinned items lead the ticker. The rest are ordered by clicks, weighted toward newer posts; the two most-clicked items (10+ clicks) get a Trending label automatically. Archive an item to take it off the site; restore it any time.</p>`;
  if(!all.length){ body.innerHTML=`<div class="wpa-card wide">${head}<div class="wpa-empty">No items saved yet, so the site is showing the 8 starter items about the November 2026 Express Entry changes.<div style="margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="dl" type="button" id="nwSeed">Add starter items so I can edit them</button></div></div></div>`;
    $("#nwSeed").onclick=async e=>{ e.target.disabled=true; try{ await newsPost("news-seed",{}); load(); }catch(x){ if(x.message==="auth") return lock("That admin key isn't right."); alert(x.message); e.target.disabled=false; } }; return; }
  body.innerHTML=`<div class="wpa-card wide">${head}<div class="nw-list">${R.length?R.map(r=>{
    const arch=r.status==="archived", expired=!arch&&r.expires&&r.expires<today;
    return `<div class="nw-item${arch?" arch":""}"><div><b><span class="nw-tag ${esc(r.tag)}">${esc(NTAG[r.tag]||r.tag)}</span>${r.pinned?"📌 ":""}${esc(r.title)}</b>
      <small>${arch?"Archived "+when(r.archived_at):"Posted "+when(r.created)} · ${r.clicks||0} click${r.clicks===1?"":"s"}${r.expires?` · ${expired?"expired":"hides after"} ${esc(r.expires)}`:""}${r.link?` · <a href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r.link)}</a>`:""}</small></div>
      <div class="nw-btns">${arch?`<button class="dl" data-nr="${esc(r.id)}">Restore</button><button class="dl" data-nd="${esc(r.id)}">Delete</button>`:`<button class="dl" data-ne="${esc(r.id)}">Edit</button><button class="dl" data-na="${esc(r.id)}">Archive</button>`}</div></div>`;
  }).join(""):`<div class="wpa-empty">Nothing here.</div>`}</div></div>`;
  const act=async(route,payload,confirmMsg)=>{ if(confirmMsg&&!confirm(confirmMsg)) return; try{ await newsPost(route,payload); load(); }catch(x){ if(x.message==="auth") return lock("That admin key isn't right."); alert(x.message); } };
  body.querySelectorAll("[data-na]").forEach(b=>b.onclick=()=>act("news-status",{id:b.dataset.na}));
  body.querySelectorAll("[data-nr]").forEach(b=>b.onclick=()=>act("news-status",{id:b.dataset.nr,restore:true}));
  body.querySelectorAll("[data-nd]").forEach(b=>b.onclick=()=>act("news-delete",{id:b.dataset.nd},"Delete this item for good? This can't be undone."));
  body.querySelectorAll("[data-ne]").forEach(b=>b.onclick=()=>{ newsEdit=all.find(r=>r.id===b.dataset.ne)||{}; render(); });
}
function newsForm(body){
  const r=newsEdit, opt=(v,l)=>`<option value="${v}"${(r.tag||"new")===v?" selected":""}>${l}</option>`;
  body.innerHTML=`<div class="wpa-card wide"><h3>${r.id?"Edit item":"New ticker item"}</h3><form class="nw-form" id="nwForm" style="margin-top:12px">
    <label class="full">Headline (shown in the ticker)<input id="nwT" maxlength="160" required value="${esc(r.title)}" placeholder="e.g. New Express Entry draw: 2,500 invitations, CRS 512"></label>
    <label class="full">Summary (shown on the All updates page)<textarea id="nwS" maxlength="400" rows="2">${esc(r.summary)}</textarea></label>
    <label>Label<select id="nwG">${opt("hot","Hot")}${opt("new","New")}${opt("trending","Trending")}${opt("update","Update")}</select></label>
    <label>Link<input id="nwL" maxlength="400" value="${esc(r.link)}" placeholder="/express-entry-2026/ or https://…"></label>
    <label>Hide automatically after (optional)<input id="nwX" type="date" value="${esc(r.expires)}"></label>
    <label class="chk"><input id="nwP" type="checkbox"${r.pinned?" checked":""}> Pin to the front of the ticker</label>
    <div class="err full" id="nwErr"></div>
    <div class="nw-acts full"><button class="dl" type="submit" style="background:var(--accent);color:var(--surface);border-color:var(--accent)">${r.id?"Save changes":"Publish to ticker"}</button><button class="dl" type="button" id="nwCancel">Cancel</button></div>
  </form></div>`;
  $("#nwCancel").onclick=()=>{ newsEdit=null; render(); };
  $("#nwForm").onsubmit=async e=>{ e.preventDefault();
    const btn=e.target.querySelector("button[type=submit]"); btn.disabled=true;
    try{ await newsPost("news-save",{id:r.id,title:$("#nwT").value,summary:$("#nwS").value,tag:$("#nwG").value,link:$("#nwL").value.trim(),expires:$("#nwX").value,pinned:$("#nwP").checked});
      newsEdit=null; newsF="live"; controls(); load();
    }catch(x){ if(x.message==="auth") return lock("That admin key isn't right."); $("#nwErr").textContent=x.message; btn.disabled=false; } };
  setTimeout(()=>$("#nwT").focus(),30);
}
async function chatFetch(path,opts={}){
  const r=await fetch("/api/admin/"+path,{...opts,headers:{"x-admin-key":KEY,"Content-Type":"application/json"}});
  if(r.status===401) throw new Error("auth");
  const j=await r.json().catch(()=>({})); if(!r.ok||!j.ok) throw new Error(j.error||"Request failed"); return j;
}
function chatStatus(){ const d=$("#chatDot"), h=$("#chatHrs"); if(!d) return; d.classList.toggle("off",!chat.open); h.textContent=(chat.open?"Live now":"Offline (visitors can leave a message)")+" · hours 8:00 to 23:00 Mountain Time, daily"; }
function chatBadge(){
  const n=chat.rows.reduce((s,r)=>s+(r.id===chat.cur&&tab==="chat"?0:(r.unread||0)),0);
  $("#chatTab").textContent="Live chat"+(n?` (${n})`:""); document.title=(n?`(${n}) `:"")+"Admin · WorkerPool";
}
async function chatList(){ const j=await chatFetch("chat"); chat.rows=j.rows; chat.open=j.open; chatBadge(); chatStatus(); }
function chatStart(){
  clearInterval(chatIv); chatTick=0;
  chatList().catch(e=>{ if(e.message==="auth") lock("That admin key isn't right."); });
  chatIv=setInterval(async()=>{
    if(!KEY||chatBusy) return; chatTick++;
    if(tab!=="chat"&&chatTick%4) return; // every 20s in the background, every 5s on the chat tab
    chatBusy=true;
    try{ await chatList(); if(tab==="chat"){ renderChatList(); if(chat.cur) await chatThread(); } }catch(e){ if(e.message==="auth") lock("That admin key isn't right."); }
    chatBusy=false;
  },5000);
}
function renderChat(body){
  if(!$("#chatWrap")){
    body.innerHTML=`<div class="wpa-card wide" id="chatWrap"><h3 id="chatHead"></h3><div class="chat-grid"><div class="chat-list" id="chatList"></div><div class="chat-conv" id="chatConv"><div class="wpa-empty" style="margin:auto;border:0">Pick a conversation.</div></div></div></div>`;
    if(chat.cur) chatOpen(chat.cur);
  }
  renderChatList();
}
function renderChatList(){
  const L=$("#chatList"); if(!L) return;
  const unread=chat.rows.filter(r=>r.unread&&r.id!==chat.cur).length;
  $("#chatHead").textContent=`${chat.rows.length} conversation${chat.rows.length===1?"":"s"}${unread?` · ${unread} with new messages`:""}`;
  L.innerHTML=chat.rows.length?chat.rows.map(r=>`<button class="chat-item" type="button" data-chat="${esc(r.id)}" aria-current="${r.id===chat.cur}">
    <span class="r1"><b>${esc(r.name||"Visitor")}</b>${r.unread&&r.id!==chat.cur?`<span class="chat-unread">${r.unread}</span>`:`<small>${when(r.updated)}</small>`}</span>
    <small>${r.last_sender==="admin"?"You: ":""}${esc((r.last_body||"").slice(0,80))}</small>
    ${r.status==="closed"?`<small>Closed</small>`:""}</button>`).join(""):`<div class="wpa-empty">No chats yet. Visitors start them from the home page.</div>`;
  L.querySelectorAll("[data-chat]").forEach(b=>b.onclick=()=>chatOpen(b.dataset.chat));
}
function chatOpen(id){
  const r=chat.rows.find(x=>x.id===id); if(!r) return;
  chat.cur=id; chat.msgs=[]; chat.last=0;
  const seen=r.visitor_seen&&Date.now()-Date.parse(r.visitor_seen)<12e4;
  $("#chatConv").innerHTML=`<div class="chat-top"><div><b>${esc(r.name||"Visitor")}</b><small>${r.email?esc(r.email):"No email given"} · started ${when(r.created)}${r.page?" on "+(r.page==="/"?"the home page":esc(r.page)):""} · <span id="chatSeen">${seen?"on the page now":"not on the page"}</span></small></div>
    <button class="dl" type="button" id="chatClose">${r.status==="closed"?"Reopen":"Close chat"}</button></div>
    <div class="chat-msgs" id="chatMsgs"></div><div class="err" id="chatErr" style="padding:0 12px"></div>
    <div class="chat-reply"><button class="chat-clip" type="button" id="chatClip" title="PDF, JPG, PNG, DOC or DOCX up to 10 MB">Attach</button><input type="file" id="chatFile" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" multiple hidden><textarea id="chatText" rows="2" maxlength="2000" placeholder="Reply to ${esc(r.name||"visitor")} (Enter to send, Shift+Enter for a new line)"></textarea><button class="gate-btn dl" type="button" id="chatSend" style="background:var(--accent);color:var(--surface);border-color:var(--accent)">Send</button></div>`;
  $("#chatSend").onclick=chatSend;
  $("#chatClip").onclick=()=>{ const f=$("#chatFile"); f.value=""; f.click(); };
  $("#chatFile").onchange=()=>chatUpload([...$("#chatFile").files]);
  $("#chatText").addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); chatSend(); } });
  $("#chatClose").onclick=async()=>{ try{ await chatFetch("chat-close",{method:"POST",body:JSON.stringify({id,reopen:r.status==="closed"})}); await chatList(); renderChatList(); chatOpen(id); }catch(e){ $("#chatErr").textContent=e.message; } };
  renderChatList(); chatThread().then(()=>$("#chatText")&&$("#chatText").focus());
}
async function chatThread(){
  const id=chat.cur; if(!id||!$("#chatMsgs")) return;
  const j=await chatFetch(`chat-thread?id=${encodeURIComponent(id)}&after=${chat.last}`);
  if(id!==chat.cur) return;
  const r=chat.rows.find(x=>x.id===id); if(r) r.unread=0; chatBadge();
  const s=$("#chatSeen"); if(s&&r) s.textContent=r.visitor_seen&&Date.now()-Date.parse(r.visitor_seen)<12e4?"on the page now":"not on the page (replies are also emailed if they gave an email)";
  if(!j.rows.length&&chat.msgs.length) return;
  j.rows.forEach(m=>{ if(m.id>chat.last){ chat.msgs.push(m); chat.last=m.id; } });
  const box=$("#chatMsgs"); const near=box.scrollHeight-box.scrollTop-box.clientHeight<80||!box.childElementCount;
  box.innerHTML=chat.msgs.map(m=>`<div class="chat-m ${m.sender==="admin"?"a":"v"}">${m.file_id?chatFileHTML(m):esc(m.body)}<small>${m.sender==="admin"?"You · ":""}${when(m.created)}</small></div>`).join("")||`<div class="wpa-note">No messages.</div>`;
  chatImgs(box); chatAudio(box);
  if(near) box.scrollTop=box.scrollHeight;
}
const chatBlobs=new Map();
const kbs=n=>n>1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB";
function chatFileHTML(m){
  if(/^audio\//.test(m.file_type)) return `<div class="chat-voice">${esc(m.body||"🎤 Voice note")}<audio controls preload="metadata" data-chataudio="${esc(m.file_id)}"></audio><button class="chat-file" type="button" data-chatfile="${esc(m.file_id)}" data-name="${esc(m.file_name)}"><em>${kbs(m.file_size||0)} · Download</em></button></div>`;
  if(/^image\//.test(m.file_type)) return `<img class="chat-img" data-chatimg="${esc(m.file_id)}" data-name="${esc(m.file_name)}" alt="${esc(m.file_name)}" title="Click to download ${esc(m.file_name)}">`;
  return `<button class="chat-file" type="button" data-chatfile="${esc(m.file_id)}" data-name="${esc(m.file_name)}">📎 ${esc(m.file_name)} <em>${kbs(m.file_size||0)} · Download</em></button>`;
}
async function chatBlob(id){
  if(chatBlobs.has(id)) return chatBlobs.get(id);
  const r=await fetch("/api/admin/chat-file?id="+encodeURIComponent(id),{headers:{"x-admin-key":KEY}});
  if(!r.ok) throw new Error("Couldn't open that file.");
  const u=URL.createObjectURL(await r.blob()); chatBlobs.set(id,u); return u;
}
const fixDur=(a)=>{ a.addEventListener("loadedmetadata",()=>{ if(a.duration===Infinity){ const t=()=>{ a.removeEventListener("timeupdate",t); a.currentTime=0; }; a.addEventListener("timeupdate",t); a.currentTime=1e101; } },{once:true}); };
function chatAudio(root){ root.querySelectorAll("audio[data-chataudio]").forEach(async a=>{ try{ fixDur(a); a.src=await chatBlob(a.dataset.chataudio); }catch(e){ a.replaceWith(Object.assign(document.createElement("small"),{textContent:"Couldn't load this voice note."})); } }); }
function chatImgs(root){ root.querySelectorAll("img[data-chatimg]").forEach(async i=>{ try{ i.src=await chatBlob(i.dataset.chatimg); i.onload=()=>{ const b=$("#chatMsgs"); if(b) b.scrollTop=b.scrollHeight; }; }catch(e){ i.alt="Couldn't load image"; } }); }
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-chatfile],img[data-chatimg]"); if(!el) return;
  try{ const u=await chatBlob(el.dataset.chatfile||el.dataset.chatimg); const a=document.createElement("a"); a.href=u; a.download=el.dataset.name||"file"; a.click(); }
  catch(x){ $("#chatErr").textContent=x.message; }
});
async function chatUpload(files){
  const c=$("#chatClip"), err=$("#chatErr"); c.disabled=true; err.textContent="";
  for(let i=0;i<files.length;i++){ const f=files[i];
    if(f.size>10485760){ err.textContent=`${f.name} is over 10 MB.`; continue; }
    c.textContent=`Sending ${i+1}/${files.length}…`;
    try{ const r=await fetch("/api/admin/chat-file",{method:"POST",headers:{"x-admin-key":KEY,"x-thread-id":chat.cur,"x-file-name":encodeURIComponent(f.name),"content-type":"application/octet-stream"},body:f});
      const j=await r.json().catch(()=>({})); if(!r.ok||!j.ok) err.textContent=`${f.name}: ${j.error||"couldn't send."}`;
      else if(j.emailed) err.innerHTML=`<span style="color:var(--muted)">They've left the page, so we emailed them that a file is waiting in the chat.</span>`;
    }catch(x){ err.textContent=`${f.name}: couldn't send.`; }
  }
  c.textContent="Attach"; c.disabled=false; await chatThread();
}
async function chatSend(){
  const t=$("#chatText"), b=$("#chatSend"), text=t.value.trim(); if(!text) return;
  b.disabled=true; $("#chatErr").textContent="";
  try{ const j=await chatFetch("chat-reply",{method:"POST",body:JSON.stringify({id:chat.cur,body:text})}); t.value=""; await chatThread();
    if(j.emailed) $("#chatErr").innerHTML=`<span style="color:var(--muted)">They've left the page, so your reply was also emailed to them.</span>`;
  }catch(e){ $("#chatErr").textContent=e.message==="auth"?"Admin key expired. Unlock again.":e.message; }
  b.disabled=false; t.focus();
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("button[data-docid]"); if(!b) return;
  const label=b.textContent; b.disabled=true; b.textContent="Downloading…";
  try{
    const r=await fetch("/api/admin/b2b-doc?id="+encodeURIComponent(b.dataset.docid),{headers:{"x-admin-key":KEY}});
    if(!r.ok){ let j={}; try{j=await r.json();}catch(x){} throw new Error(j.error||"Download failed."); }
    const a=document.createElement("a"); a.href=URL.createObjectURL(await r.blob()); a.download=b.dataset.name||"document"; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000); b.textContent=label;
  }catch(x){ b.textContent=x.message; }
  b.disabled=false;
});
if(KEY) start();
})();
</script>
</body>
</html>
