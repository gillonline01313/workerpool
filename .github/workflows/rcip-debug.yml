name: RCIP debug
on:
  push:
    branches: [rcip-debug]
permissions:
  contents: write
jobs:
  grab:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Second pass
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
          rm -rf dbg2; mkdir -p dbg2 && cd dbg2
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          curl -sL --max-time 60 -A "$UA" "https://timminsedc.com/wp-content/uploads/2026/10/6-RCIP-FCIP-Draw-Statistics.pdf" -o timmins.pdf && pdftotext -layout timmins.pdf timmins.txt || true
          curl -sL --max-time 60 -A "$UA" "https://timminsedc.com/immigration/" -o timmins.html || true
          grep -oE 'href="[^"]*\.pdf"' timmins.html | sort -u > timmins-pdfs.txt || true
          curl -sL --max-time 60 -A "$UA" "https://www.immigratenwt.ca/newsroom" -o nwt.html || true
          grep -oE 'href="[^"]*"[^>]*>[^<]*(draw|Draw)[^<]*' nwt.html > nwt-links.txt || true
          L=$(grep -oE 'href="[^"]*draw[^"]*"' nwt.html | head -1 | sed 's/href="//; s/"$//'); case "$L" in /*) L="https://www.immigratenwt.ca$L";; esac; echo "$L" >> nwt-links.txt
          [ -n "$L" ] && curl -sL --max-time 60 -A "$UA" "$L" -o nwt-draws.html && sed -e 's/<[^>]*>/ /g' nwt-draws.html | tr -s ' \n' | grep -v "^\s*$" | head -c 8000 > nwt-draws.txt || true
          curl -sL --max-time 60 -A "$UA" "https://westkootenayimmigration.ca/updates/" -o wk.html || true
          grep -oE 'href="https://westkootenayimmigration.ca/[^"]+"' wk.html | sort -u | grep -viE "apply|updates/$|category|privacy|feed|wp-" > wk-links.txt || true
          for u in $(sed 's/href="//; s/"$//' wk-links.txt | head -8); do n=$(echo "$u" | tr -c 'a-z0-9' '_' | cut -c1-80); curl -sL --max-time 60 -A "$UA" "$u" | sed -e 's/<script[^>]*>[^<]*<\/script>//g; s/<[^>]*>/ /g' | tr -s ' \n' | grep -iE "intake|recommend|score|approved|applications" | head -30 > "wk-$n.txt"; done
          curl -sL --max-time 60 -A "$UA" -H "Accept-Language: en-CA,en;q=0.9" -H "Accept: text/html" "https://nbrcip.ca/" -o nb.html -w "%{http_code}\n" > nb-code.txt || true
          ls -la
      - run: |
          git config user.name dbg; git config user.email dbg@workerpool.ca
          git add -A dbg2 && git commit -qm "rcip debug 2" && git push -q origin HEAD:rcip-debug
