# Builds the WorkerPool Android app (android/).
# Every push that changes android/ builds a test APK. When the repository secret
# ANDROID_KEYSTORE_PASSWORD is set, it also builds the signed .aab for Google Play and a signed .apk,
# and attaches them to a GitHub release named "Android app 1.0.<build>".
name: Android app
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build test APK
        run: gradle -p android assembleDebug --stacktrace
      - name: Build signed Play bundle and APK
        if: env.ANDROID_KEYSTORE_PASSWORD != ''
        run: gradle -p android bundleRelease assembleRelease --stacktrace
      - name: Collect files
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/workerpool-test-${{ github.run_number }}.apk
          if [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab out/workerpool-1.0.${{ github.run_number }}.aab
            cp android/app/build/outputs/apk/release/app-release.apk out/workerpool-1.0.${{ github.run_number }}.apk
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: workerpool-android-${{ github.run_number }}
          path: out/
      - name: Publish release
        if: env.ANDROID_KEYSTORE_PASSWORD != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-1.0.${{ github.run_number }}
          name: Android app 1.0.${{ github.run_number }}
          body: "Upload the .aab file to Google Play Console. The .apk is for installing on a phone directly (Play billing only works when installed from Google Play)."
          files: out/*
