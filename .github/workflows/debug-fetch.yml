name: debug-fetch
on: push
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p dbg
          i=0
          while read -r u; do
            [ -z "$u" ] && continue; i=$((i+1))
            code=$(curl -sSL -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36 WorkerPoolDraws/1.0" --max-time 40 -o "dbg/$i.html" -w "%{http_code} %{size_download} %{url_effective}" "$u" || echo "ERR")
            echo "$i $code $u" >> dbg/index.txt
          done <<'URLS'
          https://immigratemanitoba.com/draws/
          https://immigratemanitoba.com/2026/10/expression-of-interest-draw-282/
          https://www.saskatchewan.ca/residents/moving-to-saskatchewan/live-in-saskatchewan/by-immigrating/saskatchewan-immigrant-nominee-program/browse-sinp-programs/applicants-international-skilled-workers/international-skilled-worker-eoi-system
          https://www.gov.nl.ca/immigration/invitations-to-apply-updates/
          https://www.quebec.ca/en/immigration/permanent/skilled-workers/skilled-worker-selection-program/invitation/2026
          https://www.princeedwardisland.ca/en/topic/expression-of-interest
          https://www.gnb.ca/en/topic/family-home-community/immigration/invitation-selection-rounds.html
          https://www2.gnb.ca/content/gnb/en/corporate/promo/immigration/immigrating-to-nb/invitations-to-apply/previous-invitations-2026.html
          https://www.princeedwardisland.ca/en/information/office-of-immigration/expression-of-interest-draws
          URLS
          # trim big html for size
          for f in dbg/*.html; do head -c 1500000 "$f" > "$f.t" && mv "$f.t" "$f"; done
          git config user.name "draws-bot"; git config user.email "draws-bot@users.noreply.github.com"
          git add dbg && git commit -qm "debug fetch" && git push
