name: Wages debug
on:
  push:
    branches: [wages-debug]
permissions:
  contents: write
jobs:
  grab:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Fetch
        run: |
          rm -rf dbg; mkdir -p dbg && cd dbg
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          curl -sL --max-time 90 -A "$UA" "https://www12.statcan.gc.ca/census-recensement/2021/geo/aip-pia/attribute-attribs/index2021-eng.cfm?year=2021" -o gaf.html || echo "TIMEOUT gaf" >> fails.txt
          grep -oiE 'href="[^"]*\.(zip|csv)[^"]*"' gaf.html | sort -u > gaf-links.txt || true
          Z=$(grep -oiE 'href="[^"]*\.zip"' gaf.html | head -1 | sed 's/href="//; s/"$//'); echo "zip: $Z" >> gaf-links.txt
          case "$Z" in http*) ;; /*) Z="https://www12.statcan.gc.ca$Z";; *) Z="https://www12.statcan.gc.ca/census-recensement/2021/geo/aip-pia/attribute-attribs/$Z";; esac
          curl -sL --max-time 240 -A "$UA" "$Z" -o gaf.zip || echo "TIMEOUT gafzip" >> fails.txt
          ls -la gaf.zip; unzip -l gaf.zip > gaf-zip-list.txt || true
          unzip -o -q gaf.zip -d gafx || true
          F=$(ls gafx/* | head -1); echo "$F" > gaf-file.txt; head -c 2000 "$F" | iconv -f latin1 -t utf-8 > gaf-head.txt || true
          for q in "noc21_code:21232" "noc21_code%3A72310"; do curl -sL --max-time 60 -A "$UA" "https://www.jobbank.gc.ca/core/ta-jobtitle_en/select?q=$q&wt=json&rows=3&fl=title,noc21_code,noc_job_title_concordance_id,example_ind,jtt_ind" -o "ta-$(echo $q | tr -dc 0-9).json" || echo "TIMEOUT ta $q" >> fails.txt; done
          curl -sL --max-time 60 -A "$UA" "https://www.jobbank.gc.ca/core/ta-jobtitle_en/select?q=*:*&wt=json&rows=0" -o ta-all.json || true
          ls -la
      - run: |
          git config user.name dbg; git config user.email dbg@workerpool.ca
          rm -rf dbg/gafx dbg/gaf.zip
          git add -A dbg && git commit -qm "wages debug 2" && git push -q
