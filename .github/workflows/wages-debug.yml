name: Wages debug
on:
  push:
    branches: [wages-debug]
permissions:
  contents: write
jobs:
  grab:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Fetch
        run: |
          mkdir -p dbg && cd dbg
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          curl -sL -A "$UA" "https://open.canada.ca/data/dataset/adad580f-76b0-4502-bd05-20c125de9116/resource/9da94d63-b178-4a64-aeb3-b6a3bd721ad2/download/2a71-das-wage2025opendata-esdc-all-19nov2025-vf.csv" -o wages.csv
          ls -la wages.csv; file wages.csv
          iconv -f latin1 -t utf-8 wages.csv > w8.csv 2>/dev/null || cp wages.csv w8.csv
          head -c 3000 w8.csv > csv-head.txt; wc -l w8.csv > csv-lines.txt
          grep -m 20 "^21232\|,21232," w8.csv > csv-21232.txt || true
          grep -m 40 "^72310\|,72310," w8.csv > csv-72310.txt || true
          curl -sL -A "$UA" "https://open.canada.ca/data/api/action/package_show?id=adad580f-76b0-4502-bd05-20c125de9116" -o package.json
          curl -sL -A "$UA" "https://www.jobbank.gc.ca/wagereport/occupation/12331" -o wr-12331.html
          curl -sL -A "$UA" "https://www.jobbank.gc.ca/marketreport/wages-occupation/12331/geo9193" -o mr-12331-geo9193.html
          curl -sL -A "$UA" "https://www.jobbank.gc.ca/core/ta-jobtitle_en/select?q=software%20developer&wt=json&rows=5" -o ta.json
          curl -sL -A "$UA" "https://www.jobbank.gc.ca/trend-analysis/search-wages" -o search.html
          curl -sL -A "$UA" "https://www.jobbank.gc.ca/marketreport/wages-occupation/12331/ca" -o mr-12331-ca.html
          for f in wr-12331.html mr-12331-geo9193.html search.html mr-12331-ca.html; do sed -e 's/<script[^>]*>[^<]*<\/script>//g' "$f" | grep -oE 'href="[^"]*(wages|wagereport|marketreport|noc|geo)[^"]*"' | sort -u | head -80 > "${f%.html}-links.txt"; sed -e 's/<[^>]*>/ /g' "$f" | tr -s ' \n' | head -c 6000 > "${f%.html}.txt"; done
          ls -la
      - run: |
          git config user.name dbg; git config user.email dbg@workerpool.ca
          git add dbg && git commit -qm "wages debug" && git push -q
