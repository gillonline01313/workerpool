# Flight Deal Finder price alerts: asks workerpool.ca to re-check every alert that's due and send
# email / Telegram / phone notifications for very good deals. Runs every 3 hours.
# The check endpoint only re-checks alerts that haven't been checked in the last few hours, so it's safe to run by hand.
name: Flight alerts
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
concurrency:
  group: flight-alerts
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check every alert that's due
        run: |
          for i in $(seq 1 400); do
            out=$(curl -s -m 60 -X POST https://workerpool.ca/api/flights/check -H "user-agent: WorkerPool flight alerts" || echo '{}')
            echo "$out" | head -c 300; echo
            left=$(echo "$out" | sed -n 's/.*"remaining":\([0-9]*\).*/\1/p')
            [ -z "$left" ] && { echo "Unexpected answer, stopping."; break; }
            [ "$left" = "0" ] && break
            sleep 2
          done
